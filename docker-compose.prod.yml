services:  
  # Conteneur éphémère pour exécuter les migrations de base de données
  auth-migrations:
    restart: "no"
    image: ghcr.io/${OWNER_LC}/auth:${AUTH_VERSION:-latest}
    command: pnpm --filter auth run migrate
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: app_user            # Sécurisé
      MYSQL_PASSWORD: ${DB_PASSWORD}  # Via variable .env
      MYSQL_DB: auth_db
      RUN_MIGRATION: "true"
    depends_on:
      - mysql

  # --- INFRASTRUCTURE FIXE ---
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD} # Via variable .env
      MYSQL_DATABASE: auth_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    # On n'expose plus le port 5672 au public, l'inter-communication se fait dans le réseau Docker.
    # On expose le 15672 UNIQUEMENT si tu as besoin de voir le dashboard depuis ton navigateur.
    ports:
      - "15672:15672" 

  # --- APPLICATION ---
  frontend:
    image: ghcr.io/${OWNER_LC}/frontend:${FRONTEND_VERSION:-latest}
    container_name: todolist-frontend
    restart: always
    ports:
      - "80:80"

  gateway:
    image: ghcr.io/${OWNER_LC}/gateway:${GATEWAY_VERSION:-latest}
    restart: always
    ports:
      - "3000:3000" 
    environment:
      AUTH_URL: http://auth:3001
      TASKS_URL: http://tasks:3002
      PROJECTS_URL: http://projects:3003
      SESSION_SECRET: ${GATEWAY_SESSION_SECRET}

  auth:
    image: ghcr.io/${OWNER_LC}/auth:${AUTH_VERSION:-latest}
    restart: always
    command: pnpm --filter auth start
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DB: auth_db

  tasks:
    image: ghcr.io/${OWNER_LC}/tasks:${TASKS_VERSION:-latest}
    restart: always
    environment:
      PORT: 3002
      MYSQL_HOST: mysql
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DB: task_db
      RABBIT_URL: amqp://rabbitmq:5672

  projects:
    image: ghcr.io/${OWNER_LC}/projects:${PROJECTS_VERSION:-latest}
    restart: always
    environment:
      PORT: 3003
      MYSQL_HOST: mysql
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DB: project_db
      RABBIT_URL: amqp://rabbitmq:5672

  notifications:
    image: ghcr.io/${OWNER_LC}/notifications:${NOTIFICATIONS_VERSION:-latest}
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DB: notification_db
      RABBIT_URL: amqp://rabbitmq:5672

volumes:
  mysql_data: