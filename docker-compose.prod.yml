services:  
  # Conteneur éphémère pour exécuter les migrations de base de données avant la bascule
  auth-migrations:
    restart: "no"
    image: ghcr.io/${OWNER_LC}/auth:${AUTH_VERSION:-latest}
    command: pnpm --filter auth run migrate
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: auth_db
      RUN_MIGRATION: "true"
    depends_on:
      - mysql

  # --- INFRASTRUCTURE FIXE (Commune aux deux environnements) ---
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # --- ENVIRONNEMENT BLEU ---
  frontend-blue:
    image: ghcr.io/${OWNER_LC}/frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "5174:5173"

  gateway-blue:
    image: ghcr.io/${OWNER_LC}/gateway:${GATEWAY_VERSION:-latest}
    ports:
      - "8081:3000"
    environment:
      AUTH_URL: http://auth-blue:3001
      TASKS_URL: http://tasks-blue:3002
      PROJECTS_URL: http://projects-blue:3003
      SESSION_SECRET: ${GATEWAY_SESSION_SECRET}

  auth-blue:
    image: ghcr.io/${OWNER_LC}/auth:${AUTH_VERSION:-latest}
    command: pnpm --filter auth start
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: auth_db

  tasks-blue:
    image: ghcr.io/${OWNER_LC}/tasks:${TASKS_VERSION:-latest}
    environment:
      PORT: 3002
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672

  projects-blue:
    image: ghcr.io/${OWNER_LC}/projects:${PROJECTS_VERSION:-latest}
    environment:
      PORT: 3003
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672

  notifications-blue:
    image: ghcr.io/${OWNER_LC}/notifications:${NOTIFICATIONS_VERSION:-latest}
    environment:
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672


  # --- ENVIRONNEMENT VERT ---
  frontend-green:
    image: ghcr.io/${OWNER_LC}/frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "5175:5173"

  gateway-green:
    image: ghcr.io/${OWNER_LC}/gateway:${GATEWAY_VERSION:-latest}
    ports:
      - "8082:3000"
    environment:
      AUTH_URL: http://auth-green:3001
      TASKS_URL: http://tasks-green:3002
      PROJECTS_URL: http://projects-green:3003
      SESSION_SECRET: ${GATEWAY_SESSION_SECRET}

  auth-green:
    image: ghcr.io/${OWNER_LC}/auth:${AUTH_VERSION:-latest}
    command: pnpm --filter auth start
    environment:
      PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: auth_db

  tasks-green:
    image: ghcr.io/${OWNER_LC}/tasks:${TASKS_VERSION:-latest}
    environment:
      PORT: 3002
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672

  projects-green:
    image: ghcr.io/${OWNER_LC}/projects:${PROJECTS_VERSION:-latest}
    environment:
      PORT: 3003
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672

  notifications-green:
    image: ghcr.io/${OWNER_LC}/notifications:${NOTIFICATIONS_VERSION:-latest}
    environment:
      MYSQL_HOST: mysql
      RABBIT_URL: amqp://rabbitmq:5672

volumes:
  mysql_data: