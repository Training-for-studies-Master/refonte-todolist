name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            gateway:
              - 'gateway/**'
            services:
              - 'services/**'

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install
      - run: pnpm --filter frontend build

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install
      - run: pnpm --filter backend build

  build-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install
      - run: pnpm --filter gateway build

  build-services:
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install
      - run: pnpm --filter "services/*" build

  ci-gate:
    needs:
      - build-frontend
      - build-backend
      - build-gateway
      - build-services
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds succeeded or were skipped
        run: |
          results=(
            "${{ needs.build-frontend.result }}"
            "${{ needs.build-backend.result }}"
            "${{ needs.build-gateway.result }}"
            "${{ needs.build-services.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Build job failed with status: $result"
              exit 1
            fi
          done
          echo "✅ All builds passed or were skipped"

  # PAT + numéro de PR explicite
  auto-merge:
      needs: ci-gate
      if: always()
      runs-on: ubuntu-latest
      permissions:
        contents: write
        pull-requests: write
      steps:
        - name: Enable auto-merge
          if: needs.ci-gate.result == 'success'
          uses: peter-evans/enable-pull-request-automerge@v3
          with:
            token: ${{ secrets.PAT_TOKEN }}
            merge-method: squash
            pull-request-number: ${{ github.event.pull_request.number }}