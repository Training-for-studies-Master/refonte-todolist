name: Build and Publish Docker Images

on:
  push:
    branches: [main] 

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
            services:
              - 'services/**'

  docker-apps:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            file: ./backend/Dockerfile
            package: ./backend/package.json
            changed: ${{ needs.changes.outputs.backend }}

          - name: frontend
            file: ./frontend/Dockerfile
            package: ./frontend/package.json
            changed: ${{ needs.changes.outputs.frontend }}

          - name: gateway
            file: ./gateway/Dockerfile
            package: ./gateway/package.json
            changed: ${{ needs.changes.outputs.gateway }}

    if: needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.gateway == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.name }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.specific }}

  docker-services:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: auth
            package: ./services/auth/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: notifications
            package: ./services/notifications/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: projects
            package: ./services/projects/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: tasks
            package: ./services/tasks/package.json
            changed: ${{ needs.changes.outputs.services }}

    if: needs.changes.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.specific }}

  compatibility-check:
    needs: [docker-apps, docker-services]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    if: always() && (needs.docker-apps.result == 'success' || needs.docker-services.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Set owner lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ghcr.io/${OWNER_LC}/auth:latest
          docker pull ghcr.io/${OWNER_LC}/tasks:latest
          docker pull ghcr.io/${OWNER_LC}/gateway:latest
          docker pull ghcr.io/${OWNER_LC}/notifications:latest
          docker pull ghcr.io/${OWNER_LC}/projects:latest
          docker pull ghcr.io/${OWNER_LC}/frontend:latest

      - name: Run compatibility check
        env:
          OWNER_LC: ${{ env.OWNER_LC }}
        run: node scripts/check-compatibility.js

      - name: Run Integration Tests (Gateway)
        if: success()
        env:
          OWNER_LC: ${{ env.OWNER_LC }} # Transmet la variable pour le docker-compose ou les images
          RUN_MIGRATION: "true"
        run: |
          # 1. Démarre tes conteneurs en arrière-plan (-d)
          # Note : Si ton docker-compose.yml utilise la variable $OWNER_LC pour les images, il la lira ici.
          # Si ton docker-compose est à la racine, retire le "cd gateway" ou adapte le chemin (-f path/to/docker-compose.yml)
          docker compose up -d
          
          # 2. Attendre que les services soient prêts (healthcheck)
          # Les conteneurs peuvent prendre quelques secondes à démarrer (surtout les bases de données)
          echo "⏳ Attente du démarrage des conteneurs..."
          sleep 30

          echo "⏳ Attente active que MySQL écoute sur le port 3306..."
          # Boucle tant que le port 3306 ne répond pas (timeout de 60 secondes max)
          TIMEOUT=60
          while ! docker compose exec -T mysql mysqladmin ping -h "localhost" --silent &>/dev/null; do
            echo "   MySQL n'est pas encore prêt... pause de 2s"
            sleep 2
            TIMEOUT=$((TIMEOUT-2))
            if [ $TIMEOUT -le 0 ]; then
              echo "❌ Timeout dépassé : MySQL n'a pas démarré à temps."
              exit 1
            fi
          done

          echo "🚀 Exécution forcée des migrations dans le service auth..."
          docker compose run -T --rm -e RUN_MIGRATION=true --workdir /app/services/auth auth npm run migrate
          
          # 3. Installer les dépendances et lancer les tests
          cd gateway
          npm install
          
          # On utilise un bloc try/catch implicite en bash (via ||) pour s'assurer 
          # que 'docker compose down' soit exécuté même si les tests échouent.
          npm run test && TEST_EXIT_CODE=0 || TEST_EXIT_CODE=$?

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "======================================================="
            echo "❌ CRASH DÉTECTÉ - RECHERCHE DE L'ERREUR 500 DANS LES LOGS"
            echo "======================================================="
            echo "👉 LOGS DU SERVICE GATEWAY :"
            docker compose -f ../docker-compose.yml logs gateway --no-log-prefix | head -n 40
            echo "-------------------------------------------------------"
            echo "👉 LOGS DU SERVICE AUTH :"
            docker compose -f ../docker-compose.yml logs auth --no-log-prefix | head -n 40
            echo "======================================================="
          fi
          
          # 4. Nettoyer et couper les conteneurs
          cd ..
          docker compose down
          
          # 5. Faire remonter le bon code d'erreur à GitHub Actions
          exit $TEST_EXIT_CODE

      - name: Detect modified service and upgrade manifest
        if: success()
        run: |
          # 1. On récupère le chemin complet du premier fichier modifié
          FIRST_CHANGED_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD | head -n 1)
          echo "Fichier modifié détecté : $FIRST_CHANGED_FILE"
          
          # 2. Logique de détection du nom du service selon l'emplacement
          if [[ "$FIRST_CHANGED_FILE" == services/* ]]; then
            # Si le fichier est dans services/auth/src/..., on extrait "auth" (le 2ème élément)
            CHANGED_SERVICE=$(echo "$FIRST_CHANGED_FILE" | cut -d/ -f2)
          else
            # Si le fichier est à la racine, ex: gateway/src/..., on extrait "gateway" (le 1er élément)
            CHANGED_SERVICE=$(echo "$FIRST_CHANGED_FILE" | cut -d/ -f1)
          fi
          
          echo "Service identifié : $CHANGED_SERVICE"
          
          # 3. Liste des services valides attendus par ton manifeste
          VALID_SERVICES="auth tasks gateway notifications projects frontend"
          
          # 4. Si le service détecté est valide, on lance le script d'upgrade
          if echo "$VALID_SERVICES" | grep -w "$CHANGED_SERVICE" > /dev/null; then
            echo "🚀 Incrémentation du manifeste pour le service : $CHANGED_SERVICE"
            node scripts/upgrade-manifest.js "$CHANGED_SERVICE" patch
          else
            echo "⚠️ Le changement ($CHANGED_SERVICE) ne concerne pas un service du manifeste. Pas d'incrémentation."
          fi

      - name: Commit and Push upgraded manifest
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add compatibility-manifest.json
          
          # push uniquement s'il y a une vraie modification pour éviter de faire planter la CI
          git diff-index --quiet HEAD || (git commit -m "chore(ci): upgrade compatibility manifest [skip ci]" && git push origin HEAD:${{ github.ref }})