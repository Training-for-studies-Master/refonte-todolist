name: Build and Publish Docker Images

on:
  push:
    branches: [main] 
    paths-ignore:
      - 'compatibility-manifest.json'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
            services:
              - 'services/**'

  docker-apps:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            file: ./backend/Dockerfile
            package: ./backend/package.json
            changed: ${{ needs.changes.outputs.backend }}

          - name: frontend
            file: ./frontend/Dockerfile
            package: ./frontend/package.json
            changed: ${{ needs.changes.outputs.frontend }}

          - name: gateway
            file: ./gateway/Dockerfile
            package: ./gateway/package.json
            changed: ${{ needs.changes.outputs.gateway }}

    if: needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.gateway == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.name }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.specific }}

  docker-services:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: auth
            package: ./services/auth/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: notifications
            package: ./services/notifications/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: projects
            package: ./services/projects/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: tasks
            package: ./services/tasks/package.json
            changed: ${{ needs.changes.outputs.services }}

    if: needs.changes.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.specific }}

  compatibility-check:
    needs: [docker-apps, docker-services]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    if: always() && (needs.docker-apps.result == 'success' || needs.docker-services.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ... (Gardez tous les steps actuels de votre compatibility-check à l'identique) ...
      
      - name: Commit and Push upgraded manifest
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add compatibility-manifest.json
          git diff-index --quiet HEAD || (git commit -m "chore(ci): upgrade compatibility manifest" && git push origin HEAD:${{ github.ref }})

  deploy-integration:
    needs: [compatibility-check]
    runs-on: ubuntu-latest
    if: success()
    environment: integration # Lie ce job à l'environnement d'intégration
    
    steps:
      - name: Deploy to Integration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }} # Partagé ou à remplacer par votre clé INT
          envs: GITHUB_SHA
          script: |
            cd /app/refonte-todolist
            git pull origin main
            echo "⚡ Lancement des migrations en Intégration..."
            export TARGET_VERSION=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm auth-migrations
            echo "🔄 Lancement du déploiement en Intégration..."
            export COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            node scripts/deploy-blue-green.js

  deploy-prod:
    needs: [deploy-integration] # S'exécute SEULEMENT si l'intégration a réussi
    runs-on: ubuntu-latest
    if: success()
    environment: production # Déclenche la validation manuelle configurée sur GitHub
    
    steps:
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            cd /app/refonte-todolist
            git pull origin main
            echo "⚡ Lancement des migrations en Production..."
            export TARGET_VERSION=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm auth-migrations
            echo "🔄 Lancement de la bascule Bleu/Vert en Production..."
            export COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            node scripts/deploy-blue-green.js