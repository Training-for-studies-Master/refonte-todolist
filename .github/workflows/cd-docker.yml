name: Build and Publish Docker Images

on:
  push:
    branches: [main] 

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
            services:
              - 'services/**'

  docker-apps:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            file: ./backend/Dockerfile
            package: ./backend/package.json
            changed: ${{ needs.changes.outputs.backend }}

          - name: frontend
            file: ./frontend/Dockerfile
            package: ./frontend/package.json
            changed: ${{ needs.changes.outputs.frontend }}

          - name: gateway
            file: ./gateway/Dockerfile
            package: ./gateway/package.json
            changed: ${{ needs.changes.outputs.gateway }}

    if: needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.gateway == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.name }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.specific }}

  docker-services:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: auth
            package: ./services/auth/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: notifications
            package: ./services/notifications/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: projects
            package: ./services/projects/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: tasks
            package: ./services/tasks/package.json
            changed: ${{ needs.changes.outputs.services }}

    if: needs.changes.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.specific }}

  compatibility-check:
    needs: [docker-apps, docker-services]
    runs-on: ubuntu-latest

    if: always() && (needs.docker-apps.result == 'success' || needs.docker-services.result == 'success')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Set owner lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ghcr.io/${OWNER_LC}/auth:latest
          docker pull ghcr.io/${OWNER_LC}/tasks:latest
          docker pull ghcr.io/${OWNER_LC}/gateway:latest
          docker pull ghcr.io/${OWNER_LC}/notifications:latest

      - name: Run compatibility check
        run: node scripts/check-compatibility.js