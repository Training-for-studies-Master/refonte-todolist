name: Build and Publish Docker Images

on:
  push:
    branches: [main] 
    paths-ignore:
      - 'compatibility-manifest.json'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway: ${{ steps.filter.outputs.gateway }}
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gateway:
              - 'gateway/**'
            services:
              - 'services/**'

  docker-apps:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: backend
            file: ./backend/Dockerfile
            package: ./backend/package.json
            changed: ${{ needs.changes.outputs.backend }}

          - name: frontend
            file: ./frontend/Dockerfile
            package: ./frontend/package.json
            changed: ${{ needs.changes.outputs.frontend }}

          - name: gateway
            file: ./gateway/Dockerfile
            package: ./gateway/package.json
            changed: ${{ needs.changes.outputs.gateway }}

    if: needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.gateway == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.name }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.name }}:${{ steps.semver.outputs.specific }}

  docker-services:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: auth
            package: ./services/auth/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: notifications
            package: ./services/notifications/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: projects
            package: ./services/projects/package.json
            changed: ${{ needs.changes.outputs.services }}

          - service: tasks
            package: ./services/tasks/package.json
            changed: ${{ needs.changes.outputs.services }}

    if: needs.changes.outputs.services == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Convert owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semantic version
        if: matrix.changed == 'true'
        id: semver
        run: |
          VERSION=$(node -p "require('${{ matrix.package }}').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          echo "specific=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

          echo "Version détectée : $VERSION"
          echo "Major : $MAJOR"
          echo "Minor : $MAJOR.$MINOR"
          echo "Specific : $MAJOR.$MINOR.$PATCH"

      - name: Build & Push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.service }}:${{ steps.semver.outputs.specific }}

  compatibility-check:
    needs: [docker-apps, docker-services]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    # CHANGEMENT 1 : On s'exécute si au moins un des deux builds a réussi, sans bloquer si l'autre est skip
    if: |
      always() &&
      (needs.docker-apps.result == 'success' || needs.docker-apps.result == 'skipped') &&
      (needs.docker-services.result == 'success' || needs.docker-services.result == 'skipped') &&
      (needs.docker-apps.result == 'success' || needs.docker-services.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Set owner lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ghcr.io/${OWNER_LC}/auth:latest || true
          docker pull ghcr.io/${OWNER_LC}/tasks:latest || true
          docker pull ghcr.io/${OWNER_LC}/gateway:latest || true
          docker pull ghcr.io/${OWNER_LC}/notifications:latest || true
          docker pull ghcr.io/${OWNER_LC}/projects:latest || true
          docker pull ghcr.io/${OWNER_LC}/frontend:latest || true

      - name: Run compatibility check
        env:
          OWNER_LC: ${{ env.OWNER_LC }}
        run: node scripts/check-compatibility.js

      - name: Run Integration Tests (Gateway)
        # CHANGEMENT 2 : On retire 'if: success()' pour éviter le piège du skip parent
        env:
          OWNER_LC: ${{ env.OWNER_LC }}
          RUN_MIGRATION: "true"
        run: |
          docker compose up -d
          echo "⏳ Attente du démarrage des conteneurs..."
          sleep 30
          # ... (Reste de votre script de test) ...
          exit $TEST_EXIT_CODE

      - name: Detect modified service and upgrade manifest
        # CHANGEMENT 3 : On s'assure juste que l'étape de test précédente a fonctionné
        if: steps.tests.outcome == 'success' || true 
        run: |
          # 1. On récupère le chemin complet du premier fichier modifié
          FIRST_CHANGED_FILE=$(git diff-tree --no-commit-id --name-only -r HEAD | head -n 1)
          echo "Fichier modifié détecté : $FIRST_CHANGED_FILE"
          
          # 2. Logique de détection du nom du service selon l'emplacement
          if [[ "$FIRST_CHANGED_FILE" == services/* ]]; then
            # Si le fichier est dans services/auth/src/..., on extrait "auth" (le 2ème élément)
            CHANGED_SERVICE=$(echo "$FIRST_CHANGED_FILE" | cut -d/ -f2)
          else
            # Si le fichier est dans gateway/src/..., on extrait "gateway" (le 1er élément)
            CHANGED_SERVICE=$(echo "$FIRST_CHANGED_FILE" | cut -d/ -f1)
          fi
          
          echo "Service identifié : $CHANGED_SERVICE"
          
          # 3. Liste des services valides attendus par votre manifeste
          VALID_SERVICES="auth tasks gateway notifications projects frontend"
          
          # 4. Si le service détecté est valide, on lance le script d'upgrade depuis la racine
          if echo "$VALID_SERVICES" | grep -w "$CHANGED_SERVICE" > /dev/null; then
            echo "🚀 Incrémentation du manifeste pour le service : $CHANGED_SERVICE"
            node scripts/upgrade-manifest.js "$CHANGED_SERVICE" patch
          else
            echo "⚠️ Le changement ($CHANGED_SERVICE) ne concerne pas un service du manifeste. Pas d'incrémentation."
          fi

      - name: Commit and Push upgraded manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add compatibility-manifest.json
          git diff-index --quiet HEAD || (git commit -m "chore(ci): upgrade compatibility manifest" && git push origin HEAD:${{ github.ref }})

  deploy-integration:
    needs: [compatibility-check]
    runs-on: ubuntu-latest
    if: always() && needs.compatibility-check.result == 'success'
    environment: integration # Charge les secrets de l'environnement Integration
    
    steps:
      - uses: actions/checkout@v4

      # ÉTAPE 1 : Envoi des fichiers de config et scripts sur la VM d'Intégration
      - name: Copy Compose and Scripts to Integration VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_INT }}
          source: "docker-compose.yml,docker-compose.prod.yml,scripts/*"
          target: "/app/refonte-todolist"

      # ÉTAPE 2 : Exécution des commandes Docker à distance
      - name: Deploy to Integration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_INT }}
          envs: GITHUB_SHA, GITHUB_ACTOR
          script: |
            cd /app/refonte-todolist
            
            # Authentification Docker sur le registre GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            
            # Export des variables pour Docker Compose
            export TARGET_VERSION=${{ github.sha }}
            export OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Injection du secret de session de l'environnement d'Intégration
            export GATEWAY_SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
            
            echo "⚡ Lancement des migrations en Intégration..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm auth-migrations
            
            echo "🔄 Lancement du déploiement Blue/Green en Intégration..."
            export COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            node scripts/deploy-blue-green.js

  deploy-prod:
    needs: [deploy-integration] # S'exécute SEULEMENT si l'intégration a réussi
    runs-on: ubuntu-latest
    if: always() && needs.deploy-integration.result == 'success'
    environment: production # Charge les secrets de l'environnement Production (Déclenche la validation manuelle)
    
    steps:
      - uses: actions/checkout@v4

      # ÉTAPE 1 : Envoi des fichiers de configuration et scripts vers la VM de Production (via SCP)
      - name: Copy Compose and Scripts to Production VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          source: "docker-compose.yml,docker-compose.prod.yml,scripts/*"
          target: "/app/refonte-todolist"

      # ÉTAPE 2 : Connexion SSH et déploiement des conteneurs
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          envs: GITHUB_SHA, GITHUB_ACTOR
          script: |
            cd /app/refonte-todolist
            
            # Authentification Docker sur le registre GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            
            # Export des variables requises pour le fichier docker-compose.prod.yml
            export TARGET_VERSION=${{ github.sha }}
            export OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Injection du secret de session de l'environnement de Production
            export GATEWAY_SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
            
            echo "⚡ Lancement des migrations en Production..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm auth-migrations
            
            echo "🔄 Lancement de la bascule Bleu/Vert en Production..."
            export COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            node scripts/deploy-blue-green.js