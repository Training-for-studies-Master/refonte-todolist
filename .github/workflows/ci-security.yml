name: CI Security & Quality

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node + pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.0.0

      - name: Install dependencies
        run: pnpm install


      - name: Dependency audit
        run: pnpm audit --audit-level=high


      - name: Validate Docker Compose
        run: docker compose config

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep tag_name | cut -d '"' -f4 | tr -d 'v')
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --no-git --verbose

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --failOn GPL --onlyAllow "MIT;ISC;Apache-2.0;BSD"