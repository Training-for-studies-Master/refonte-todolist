name: Nightly CI (Integration & E2E)

on:
  schedule:
    - cron: "0 2 * * *" # tous les jours à 02:00 UTC
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration


  e2e-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🔥 1. START BACKEND + FRONTEND (gateway)
      - name: Start app
        run: npm run start &

      # 🔥 2. WAIT APP READY
      - name: Wait for app
        run: npx wait-on http://localhost:3000

      # 🔥 3. SEED USER (test/test via API gateway)
      - name: Seed test user
        run: npm run seed:test

      # 🔥 4. RUN PLAYWRIGHT
      - name: Run E2E tests (Playwright)
        run: npx playwright test