events {}

http {
    # On supprime le resolver générique car les upstreams gèrent la répartition
    
    upstream frontend_servers {
        # Si un environnement est éteint, Nginx passera automatiquement à l'autre
        server frontend-blue:5173 max_fails=1 fail_timeout=5s;
        server frontend-green:5173 max_fails=1 fail_timeout=5s;
    }

    upstream gateway_servers {
        server gateway-blue:3000 max_fails=1 fail_timeout=5s;
        server gateway-green:3000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Toutes les requêtes vers /api
        location /api/ {
            # Suppression de la variable pour cibler directement l'upstream
            proxy_pass http://gateway_servers/; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend)
        location / {
            # Suppression de la variable pour cibler directement l'upstream
            proxy_pass http://frontend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}