events {}

http {
    # Résolveur Docker pour le Blue/Green dynamique
    resolver 127.0.0.11 valid=5s;

    upstream frontend_servers {
        server frontend-blue:5173 max_fails=1 fail_timeout=5s;
        server frontend-green:5173 max_fails=1 fail_timeout=5s;
    }

    upstream gateway_servers {
        server gateway-blue:3000 max_fails=1 fail_timeout=5s;
        server gateway-green:3000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # On intercepte les requêtes API qui commencent par /v2/
        location /v2/ {
            set $upstream_gateway gateway_servers;
            
            # Pas de "/" à la fin ! On transmet tout le bloc (ex: /v2/auth/me) à la gateway
            proxy_pass http://$upstream_gateway; 
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (les fichiers HTML/JS/CSS du frontend)
        location / {
            set $upstream_frontend frontend_servers;
            proxy_pass http://$upstream_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}