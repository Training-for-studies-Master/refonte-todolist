events {}

http {
    # Le résolveur de Docker avec un cache très court (5s)
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # Toutes les requêtes vers l'API Gateway (/v2/)
        location /v2/ {
            # On définit dynamiquement la cible. 
            # Si le déploiement vient de passer sur green, l'application frontend (qui utilise le nouveau build)
            # ou un header peut aider, mais le plus simple en Blue/Green avec Nginx unique
            # est de cibler un upstream ou directement le nom du conteneur via une variable.
            
            # Pour que le Blue/Green fonctionne sans crash, on utilise une variable globale ou locale.
            # Remplaçons l'upstream problématique par une détection ou une variable simple :
            
            set $target_gateway "gateway-green:3000"; 
            # Note : Idéalement, ton script de déploiement peut mettre à jour cette variable, 
            # ou alors on utilise l'astuce ci-dessous pour laisser Nginx essayer sans crasher :
            
            proxy_pass http://$target_gateway;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend)
        location / {
            # En utilisant une variable plutot qu'un upstream en dur, 
            # Nginx ne plantera JAMAIS si le conteneur est éteint.
            set $target_frontend "frontend-green:5173";
            
            proxy_pass http://$target_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}