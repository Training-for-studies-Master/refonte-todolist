events {}

http {
    # Le résolveur de Docker (Indispensable pour résoudres les upstreams via variables)
    resolver 127.0.0.11 valid=5s;

    upstream gateway_servers {
        server gateway-blue:3000 max_fails=0 fail_timeout=5s;
        server gateway-green:3000 max_fails=0 fail_timeout=5s;
    }

    server {
        listen 80;

        # Toutes les requêtes vers l'API Gateway
        location /v2/ {
            # Utiliser directement le nom de l'upstream défini ci-dessus
            proxy_pass http://gateway_servers;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend statique servi par Nginx)
        root /usr/share/nginx/html;
        location / {
            set $target_frontend "frontend-active:5173";
            proxy_pass http://$target_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}