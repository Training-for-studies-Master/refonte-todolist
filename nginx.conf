events {}

http {
    # Nginx va automatiquement chercher la couleur active grâce au DNS Docker
    upstream frontend {
        server frontend-blue:5173 max_fails=1 fail_timeout=10s;
        server frontend-green:5173 max_fails=1 fail_timeout=10s;
    }

    upstream gateway {
        server gateway-blue:3000 max_fails=1 fail_timeout=10s;
        server gateway-green:3000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        # 1. Toutes les requêtes vers /api sont envoyées au Gateway actif
        location /api/ {
            proxy_pass http://gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Tout le reste du trafic est envoyé au Frontend actif
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Support des WebSockets (pour Vite en dev/intégration)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}