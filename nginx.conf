events {}

http {
    # Le résolveur de Docker (Indispensable pour résoudres les upstreams via variables)
    resolver 127.0.0.11 valid=5s;

    upstream frontend_servers {
        # max_fails=0 empêche Nginx de marquer le serveur comme "mort" définitivement si une couleur est éteinte
        # En production l'image frontend sert généralement sur le port 80
        server frontend-blue:80 max_fails=0 fail_timeout=5s;
        server frontend-green:80 max_fails=0 fail_timeout=5s;
    }

    upstream gateway_servers {
        server gateway-blue:3000 max_fails=0 fail_timeout=5s;
        server gateway-green:3000 max_fails=0 fail_timeout=5s;
    }

    server {
        listen 80;

        # Toutes les requêtes vers l'API Gateway
        location /v2/ {
            # Utiliser directement le nom de l'upstream défini ci-dessus
            proxy_pass http://gateway_servers;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend)
        location / {
            proxy_pass http://frontend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}