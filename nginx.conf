events {}

http {
    # Indispensable : force Nginx à interroger le DNS de Docker toutes les 5 secondes
    resolver 127.0.0.11 valid=5s;

    upstream frontend {
        server frontend-blue:4173 max_fails=1 fail_timeout=5s;
        server frontend-green:4173 max_fails=1 fail_timeout=5s;
    }

    upstream gateway {
        server gateway-blue:3000 max_fails=1 fail_timeout=5s;
        server gateway-green:3000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Toutes les requêtes vers /api
        location /api/ {
            set $target_gateway http://gateway/;
            proxy_pass $target_gateway;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend)
        location / {
            set $target_frontend http://frontend;
            proxy_pass $target_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}