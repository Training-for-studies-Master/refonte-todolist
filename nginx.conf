events {}

http {
    # Le résolveur de Docker (Indispensable pour résoudres les upstreams via variables)
    resolver 127.0.0.11 valid=5s;

    upstream frontend_servers {
        # max_fails=0 empêche Nginx de marquer le serveur comme "mort" définitivement si une couleur est éteinte
        server frontend-blue:5173 max_fails=0 fail_timeout=5s;
        server frontend-green:5173 max_fails=0 fail_timeout=5s;
    }

    upstream gateway_servers {
        server gateway-blue:3000 max_fails=0 fail_timeout=5s;
        server gateway-green:3000 max_fails=0 fail_timeout=5s;
    }

    server {
        listen 80;

        # Toutes les requêtes vers l'API Gateway
        location /v2/ {
            # Passer par une variable force Nginx à consulter le DNS au moment de la requête, 
            # évitant les crashs si l'un des environnements est arrêté.
            set $upstream_gateway "gateway_servers";
            proxy_pass http://$upstream_gateway;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Tout le reste (Frontend)
        location / {
            set $upstream_frontend "frontend_servers";
            proxy_pass http://$upstream_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}